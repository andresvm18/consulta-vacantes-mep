    <script>
        function actualizarPlaceholder() {
            var tipoBusqueda = document.querySelector('input[name="tipoBusqueda"]:checked').value;
            var inputBusqueda = document.getElementById("txtCedula");
            var labelBusqueda = document.getElementById("labelBusqueda");


            if (tipoBusqueda === "identificacion") {
                labelBusqueda.innerText = "Cédula de Identidad";
                inputBusqueda.setAttribute("aria-label", "Digite su Cedula en formato de 9 digitos");
                inputBusqueda.placeholder = "Formato: 000000000";
                limpiarGridView('grvNombramientos');

             } else {
                 labelBusqueda.innerText = "Número de Vacante";
                 inputBusqueda.placeholder = "Ingrese Número de Vacante";
                 inputBusqueda.setAttribute("aria-label", "Digite el número de vacante");
                 limpiarGridView('grvNombramientos');
            }
        }

        function limpiarGridView(gridId) {
            var grid = document.getElementById(gridId);

            if (!grid) return;

            while (grid.rows.length > 1) {
                grid.deleteRow(1);
            }
        }

        $(document).ready(function () {

            $("#btnConsultar").click(function () {

                console.log("registro");
                // Deshabilita el boton
                $(this).prop("disabled", true);

                /* Agrega el spinner al botón */
                $(this).html(
                    `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Consultando...`

                );

            });
        });


    </script>
