[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"


[project]
name = "consulta-vacantes-mep"
version = "0.3.0"
description = "Consulta vacantes y nombramientos docentes publicados por el MEP de Costa Rica"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Andres Viquez Marchena" }]
keywords = ["scraping", "playwright", "costa-rica", "education", "job-vacancies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Office/Business",
]

dependencies = [
    "playwright>=1.49,<2.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "tenacity>=9.0,<10.0",
    "typer>=0.15,<1.0",
    "rich>=13.9,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "pandas-stubs",
    "types-openpyxl",
]

[project.scripts]
consulta-vacantes-mep = "consulta_vacantes_mep.cli:main"

[project.urls]
Homepage = "https://github.com/andresvm18/consulta-vacantes-mep"
Issues = "https://github.com/andresvm18/consulta-vacantes-mep/issues"
Changelog = "https://github.com/andresvm18/consulta-vacantes-mep/blob/main/CHANGELOG.md"


# Layout src/: el codigo solo es importable si el paquete esta instalado, lo
# que garantiza que los tests prueben lo mismo que se distribuye.
[tool.hatch.build.targets.wheel]
packages = ["src/consulta_vacantes_mep"]

[tool.hatch.build.targets.sdist]
include = [
    "src/consulta_vacantes_mep",
    "tests",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
]


# ─────────────────────────────────────────────────────────────────────────────
#  Ruff: linter y formateador
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez: detecta datetime.now() sin zona horaria
    "T20",       # flake8-print: nada de print() fuera de la capa CLI
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RET",       # flake8-return
    "ARG",       # argumentos sin usar
    "PL",        # pylint
    "RUF",       # reglas propias de ruff
    "BLE",       # flake8-blind-except: detecta `except Exception`
    "S",         # chequeos de seguridad de bandit
]

ignore = [
    "PLR0913",   # demasiados argumentos
    "S101",      # assert es legitimo en tests

    # La interfaz esta en espanol: las comillas angulares, la enye y los
    # caracteres de dibujo de caja son intencionales. Ignorados de forma
    # permanente, no son deuda tecnica.
    "RUF001",
    "RUF002",
    "RUF003",

    # ── Trinquete progresivo ──────────────────────────────────────────────────
    # Cada linea de abajo se elimina en la etapa indicada, cuando el codigo que
    # la viola queda corregido. No agregar entradas nuevas aqui.
    "E501",      # Etapa 1: firmas largas en los scrapers
    "PLR2004",   # Etapa 1: los 13 y 8 magicos del conteo de columnas
    "DTZ005",    # Etapa 3: datetime.now() sin zona horaria
    "BLE001",    # Etapa 4: except Exception generalizado
    "S603",      # Etapa 4: subprocess.run en playwright_setup
]

[tool.ruff.lint.per-file-ignores]
# Nada en src/ imprime: la interfaz escribe a traves de la consola de Rich.
"tests/**" = ["S", "PLR2004"]
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"


# ─────────────────────────────────────────────────────────────────────────────
#  Mypy: chequeo estatico de tipos
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false   # pasa a true cuando lleguen los modelos (Etapa 3)
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true


# ─────────────────────────────────────────────────────────────────────────────
#  Pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not e2e",
]
markers = [
    "e2e: consulta el sitio real del MEP; excluido de las corridas por defecto",
    "slow: tarda mas de unos pocos segundos",
]

[tool.coverage.run]
branch = true
source = ["src/consulta_vacantes_mep"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]