[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"


[project]
name = "consulta-vacantes-mep"
version = "0.3.0"
description = "Consulta vacantes y nombramientos docentes publicados por el MEP de Costa Rica"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Andres Viquez Marchena" }]
keywords = ["scraping", "playwright", "costa-rica", "education", "job-vacancies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Office/Business",
]

dependencies = [
    "playwright>=1.49,<2.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "tenacity>=9.0,<10.0",
    "typer>=0.15,<1.0",
    "rich>=13.9,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "pandas-stubs",
    "types-openpyxl",
]

[project.scripts]
consulta-vacantes-mep = "consulta_vacantes_mep.cli:main"

[project.urls]
Homepage = "https://github.com/andresvm18/consulta-vacantes-mep"
Issues = "https://github.com/andresvm18/consulta-vacantes-mep/issues"
Changelog = "https://github.com/andresvm18/consulta-vacantes-mep/blob/main/CHANGELOG.md"


# Layout src/: code is only importable when the package is installed, which
# ensures tests test the same code that gets distributed.
[tool.hatch.build.targets.wheel]
packages = ["src/consulta_vacantes_mep"]

[tool.hatch.build.targets.sdist]
include = [
    "src/consulta_vacantes_mep",
    "tests",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
]


# ─────────────────────────────────────────────────────────────────────────────
#  Ruff: linter and formatter
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez: detects datetime.now() without timezone
    "T20",       # flake8-print: no print() outside CLI layer
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RET",       # flake8-return
    "ARG",       # unused arguments
    "PL",        # pylint
    "RUF",       # ruff's own rules
    "BLE",       # flake8-blind-except: detects `except Exception`
    "S",         # bandit security checks
]

ignore = [
    "PLR0913",   # too many arguments
    "S101",      # assert is legitimate in tests

    # The interface is in Spanish: angle quotes, enye, and box-drawing
    # characters are intentional. Permanently ignored, not technical debt.
    "RUF001",
    "RUF002",
    "RUF003",

    # ── Progressive ratchet ──────────────────────────────────────────────────
    # Each line below is removed in the indicated stage, when the code that
    # violates it is fixed. Do not add new entries here.
    "E501",      # Stage 1: long signatures in scrapers
    "PLR2004",   # Stage 1: magic 13 and 8 for column counting
    "DTZ005",    # Stage 3: datetime.now() without timezone
    "BLE001",    # Stage 4: generalized except Exception
    "S603",      # Stage 4: subprocess.run in playwright_setup
]

[tool.ruff.lint.per-file-ignores]
# Nothing in src/ prints: the interface writes through Rich's console.
"tests/**" = ["S", "PLR2004"]
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"


# ─────────────────────────────────────────────────────────────────────────────
#  Mypy: static type checking
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true



# ─────────────────────────────────────────────────────────────────────────────
#  Pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not e2e",
]
markers = [
    "e2e: queries the real MEP site; excluded from default runs",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["src/consulta_vacantes_mep"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]