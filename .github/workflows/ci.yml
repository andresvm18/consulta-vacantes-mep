name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer commit on the same branch makes the running job pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # The config declares its own files, so a bare call checks src and tests.
      - name: Mypy
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: pip install -e ".[dev]"

      # The parsing tests are not unit tests in the usual sense: they drive a
      # real browser over the HTML captured from the MEP sites, which is the
      # whole reason they catch what they catch.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Pytest
        run: pytest